# vigil instant tier. Deploy with deploy.ps1 (or: npx wrangler deploy).
name = "vigil"
main = "worker.js"
compatibility_date = "2026-08-01"

# Serves the status page at vigil.<your-subdomain>.workers.dev
workers_dev = true

# Poll every minute. Boards rotate across 2 buckets, so each board is checked
# every 2 minutes - posting-to-phone latency is ~1-3 minutes.
[triggers]
crons = ["* * * * *"]

[vars]
# Point at YOUR fork so the worker follows your filters/slugs without redeploys.
CONFIG_URL = "https://raw.githubusercontent.com/AbhigyaGoel/vigil/master/config.json"

# Dedupe memory. deploy.ps1 creates the namespace and fills in the id.
[[kv_namespaces]]
binding = "SEEN"
id = "fa7d88ba4143442686907a56319e8fdd"

