# Runs vigil on GitHub's servers, no laptop needed. Cron floor is 5 min;
# real-world latency is often 5-20 min under scheduler load. The private ntfy
# topic lives in the NTFY_TOPIC repo secret, never in the code.
name: vigil

on:
  schedule:
    # Every 5 min (GitHub's floor), offset from :00 to dodge scheduler congestion.
    - cron: "1-56/5 * * * *"
  workflow_dispatch:

concurrency:
  group: vigil
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        run: python watch.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Set repo variable SKIP_ATS=1 once the Cloudflare worker owns the
          # instant tier, so the same role doesn't alert from both systems.
          SKIP_ATS: ${{ vars.SKIP_ATS }}

      - name: Commit seen.json (the dedupe memory)
        run: |
          git config user.name "vigil"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
