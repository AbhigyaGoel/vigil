# Runs jobwatch on GitHub's servers - no laptop needed.
# Every ~15 min (GitHub delays scheduled runs a bit under load; expect 15-40 min
# real-world latency). Your private ntfy topic lives in the NTFY_TOPIC repo
# secret, never in the code.
name: jobwatch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: jobwatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        run: python watch.py --once
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          # Optional real SMS - add these secrets to enable:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}

      - name: Commit seen.json (the dedupe memory)
        run: |
          git config user.name "jobwatch"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
